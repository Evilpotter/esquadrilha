<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Esquadrilha – Mesa de sons</title>
<style>
body{margin:0;background:#0b1622;color:#e8eef5;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:980px;margin:0 auto;padding:20px}
h1{margin:.2em 0 .1em;font-size:28px}
p.sub{margin:0 0 18px;color:#9fb3c8;font-size:14px}
h2{font-size:15px;color:#ffd36b;margin:22px 0 8px;text-transform:uppercase;letter-spacing:.06em}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
button{all:unset;cursor:pointer;background:#14263a;border:1px solid #3a5672;border-radius:10px;padding:10px 12px;display:block}
button:hover{border-color:#7fc0ff}
button.toca{background:#1d4f86;border-color:#7fc0ff}
b{display:block;font-size:14px}
small{color:#9fb3c8;font-size:12px}
a{color:#7fc0ff}
</style>
</head>
<body>
<main>
<h1>Mesa de sons</h1>
<p class="sub">Toque em um som para ouvir. Música toca até o fim (toque de novo para parar). Para trocar um som, substitua o arquivo .ogg de mesmo nome em <code>som/</code>. <a href="../index.html">Voltar ao jogo</a></p>
<div id="lista"></div>
</main>
<script>
const GRUPOS = [
  ['Músicas', 'musica', [
    ['menu', 'Tema da Esquadrilha (tela inicial)'], ['fase', 'Céu de Batalha (fases)'], ['chefao', 'Fúria do Chefão'],
    ['vitoria', 'Vitória (chefão derrotado)'], ['derrota', 'Fim de jogo']]],
  ['Tiros da nave', 'efeitos', [
    ['tiro_metralhadora', 'Metralhadora'], ['tiro_leque', 'Leque'], ['tiro_missil', 'Mísseis teleguiados'], ['tiro_plasma', 'Canhão de plasma'],
    ['tiro_drone', 'Drones de apoio'], ['tiro_ricochete', 'Ricochete'], ['ricochete_quique', 'Ricochete quicando'], ['tiro_raio', 'Raio em cadeia'],
    ['serra_corte', 'Serra orbital cortando'], ['tiro_bumerangue', 'Bumerangue'], ['bumerangue_pega', 'Bumerangue voltando'], ['tiro_saraivada', 'Saraivada de mísseis']]],
  ['Âncora Negra (nave pirata)', 'efeitos', [
    ['tiro_ancora', 'Âncora arremessada'], ['ancora_pega', 'Âncora prende o inimigo'], ['onda', 'Onda'], ['dragao_vira', 'Vira dragão de água'],
    ['jato_agua', 'Jato do dragão'], ['canhao_bordo', 'Canhões de bordo'], ['barril_solta', 'Barril de pólvora'], ['papagaio', 'Papagaio bicando'], ['redemoinho', 'Redemoinho']]],
  ['Fênix', 'efeitos', [
    ['tiro_pena', 'Penas de fogo'], ['asas_fogo', 'Asas de fogo (rastro)'], ['meteoro', 'Chuva de meteoros'], ['filhote', 'Filhote mergulhando'],
    ['sol_nascente', 'Sol nascente'], ['fenix_ovo', 'Vira ovo'], ['fenix_renasce', 'Renasce do fogo']]],
  ['Acertos e explosões', 'efeitos', [
    ['acerto', 'Acerto no inimigo'], ['acerto_chefao', 'Acerto no chefão'], ['escudo_bloqueio', 'Escudo do Guardião'],
    ['explosao_area', 'Tiro explosivo'], ['explosao_pequena', 'Explosão pequena'], ['explosao_media', 'Explosão média'],
    ['explosao_grande', 'Explosão grande'], ['explosao_chefao', 'Chefão destruído']]],
  ['Tiros dos inimigos', 'efeitos', [
    ['inimigo_laser', 'Laser'], ['inimigo_metralhadora', 'Metralhadora'], ['inimigo_missil', 'Míssil'], ['inimigo_plasma', 'Plasma (disco voador)'],
    ['inimigo_granada', 'Granada (artilharia)'], ['chefao_tiro', 'Bola de fogo do chefão']]],
  ['Chefões', 'efeitos', [
    ['chefao_alerta', 'Corneta: chefão chegando'], ['chefao_chegada', 'Chefão entrando'], ['chefao_furia', 'Fúria'],
    ['raio_carga', 'Raio carregando (Colosso)'], ['raio_disparo', 'Raio disparando'], ['trovao', 'Trovão (Tempestade)']]],
  ['Jogador', 'efeitos', [
    ['dano_jogador', 'Levou dano'], ['jogador_abatido', 'Nave abatida'], ['xp', 'Cristal de XP'], ['nivel', 'Subiu de nível'],
    ['escolha', 'Escolheu melhoria'], ['conquista', 'Skin liberada'], ['entrada', 'Jogador 2 entrou'], ['nova_fase', 'Nova fase']]],
  ['Menus', 'efeitos', [
    ['menu_mover', 'Mover cursor'], ['menu_ok', 'Confirmar'], ['menu_voltar', 'Voltar'], ['pausa', 'Pausar'], ['despausa', 'Continuar']]],
];
let atual = null, botao = null;
const lista = document.getElementById('lista');
for (const [titulo, pasta, itens] of GRUPOS) {
  const h = document.createElement('h2'); h.textContent = titulo; lista.appendChild(h);
  const g = document.createElement('div'); g.className = 'grade'; lista.appendChild(g);
  for (const [arq, nome] of itens) {
    const b = document.createElement('button');
    b.innerHTML = '<b></b><small></small>';
    b.querySelector('b').textContent = nome; b.querySelector('small').textContent = arq + '.ogg';
    b.onclick = () => {
      const mesmo = botao === b;
      if (atual) { atual.pause(); botao.classList.remove('toca'); atual = null; botao = null; }
      if (mesmo && pasta === 'musica') return;
      atual = new Audio(pasta + '/' + arq + '.ogg'); botao = b; b.classList.add('toca');
      atual.onended = () => { b.classList.remove('toca'); if (botao === b) { atual = null; botao = null; } };
      atual.play().catch(() => b.classList.remove('toca'));
    };
    g.appendChild(b);
  }
}
</script>
</body>
</html>
